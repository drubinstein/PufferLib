[base]
env_name = rubiks

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 0
seed = 42

[env]
shuffles = 35
max_episode_steps = 300
depth_exponent = 1.0
advance_threshold = 0.5
advance_window = 20
anim_time = 0.5

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 100000000
learning_rate = 0.002
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.7
replay_ratio = 2
clip_coef = 0.01
vf_coef = 0.1
vf_clip_coef = 0.1
max_grad_norm = 1.0
ent_coef = 0.02
beta1 = 0.9
beta2 = 0.99
eps = 1e-6
minibatch_size = 32768
horizon = 64
vtrace_rho_clip = 3.0
vtrace_c_clip = 3.0
prio_alpha = 1
prio_beta0 = 0.6

[sweep]
# Full sweep space, copied from config/default.ini so it's explicit/tunable here, plus
# depth_exponent. Only change vs default: metric = max_shuffles (curriculum frontier),
# and total_timesteps keeps scale=time so Protein budgets trials by wall-clock.
# advance_threshold/advance_window are intentionally NOT swept (they define max_shuffles
# -> sweeping them would game the metric).
method = Protein
metric = max_shuffles
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 1200
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
match_enemy_model_path = ''
match_num_games = 1024
match_enemy_hidden_size = 0
match_enemy_num_layers = 0

[sweep.env.depth_exponent]
distribution = uniform
min = 0.0
max = 3.0
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 1e11
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

#[sweep.vec.total_agents]
#distribution = uniform_pow2
#min = 256
#max = 16384
#scale = auto

[sweep.vec.num_buffers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 1024
scale = auto

#[sweep.train.minibatch_size]
#distribution = uniform_pow2
#min = 4096
#max = 65536
#scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.995
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.01
max = 1.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.beta1]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.beta2]
distribution = logit_normal
min = 0.9
max = 0.99999
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-14
max = 1e-4
scale = auto

[sweep.train.prio_alpha]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.0
max = 1.0
scale = auto
