[base]
env_name = rubiks

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 0
seed = 42

[env]
shuffles = 35
max_episode_steps = 300
depth_exponent = 1.0
advance_threshold = 0.5
advance_window = 20
anim_time = 0.5

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 100000000
learning_rate = 0.002
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.7
replay_ratio = 2
clip_coef = 0.01
vf_coef = 0.1
vf_clip_coef = 0.1
max_grad_norm = 1.0
ent_coef = 0.02
beta1 = 0.9
beta2 = 0.99
eps = 1e-6
minibatch_size = 32768
horizon = 64
vtrace_rho_clip = 3.0
vtrace_c_clip = 3.0
prio_alpha = 1
prio_beta0 = 0.6

[sweep]
# Optimize the curriculum frontier. NOTE: advance_threshold/advance_window are the
# gate that *defines* max_shuffles, so they are deliberately NOT swept (sweeping them
# would game the metric). depth_exponent (sampling) is fair game; RL/policy hypers are
# inherited from config/default.ini's [sweep.*] blocks.
metric = max_shuffles

[sweep.env.depth_exponent]
distribution = uniform
min = 0.0
max = 3.0
scale = auto
